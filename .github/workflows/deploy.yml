name: Deploy resume to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # Install dependencies
      - name: Install dependencies
        run: npm install

      # Build the project
      - name: Build project
        run: npm run build

      # Fail fast if output still references source entry instead of bundled assets.
      - name: Validate build output
        run: |
          test -f dist/index.html
          if grep -q '/src/main.js' dist/index.html; then
            echo "Build output is invalid: dist/index.html still references /src/main.js"
            exit 1
          fi
          grep -q '/assets/' dist/index.html

      # Deploy to GitHub pages
      - name: Deploy to GitHub pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
